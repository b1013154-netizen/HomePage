<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172c28"><title>へんてこ発明工房｜ホームページの遊び場</title><link rel="stylesheet" href="/invention.css"><link rel="stylesheet" href="/playground-nav.css"><script src="/invention-plans.js" defer></script><script src="/invention-art.js" defer></script><script src="/invention-motion.js" defer></script><script src="/invention-devices.js" defer></script><script src="/invention.js" defer></script><script src="/playground-nav.js" defer></script></head><body>
<header><a href="/">✳　ホームページの遊び場</a><a href="#bench">作業台へ ↓</a></header>
<section class="cover"><div><p>THE INVENTOR’S WORKSHOP</p><h1>へんてこ<br>発明工房<span>。</span></h1><p class="intro">鋼の玉をひとつ、転がす。<br>あとはあなたの仕掛け次第。</p></div></section>
<main id="bench"><div class="plan"><div><label for="plans">工房の依頼帳</label><select id="plans"></select></div><span id="count"></span></div>
<div class="desk"><section class="machine"><div class="plate"><h2>からくり作業台</h2><span id="budget"></span></div><div class="tabletop"><div class="frame"><canvas id="scene" aria-hidden="true"></canvas><div id="cells" role="group" aria-label="仕掛けの配置"></div></div></div>
<div class="controls"><button id="run">▶　玉を放す</button><button id="reset">設計を戻す</button><button id="next" hidden>次のお題へ →</button></div><p id="status" aria-live="polite"></p></section>
<aside><h2 id="title"></h2><p id="brief"></p><div id="requirements"></div><hr><h2>発明の設計机</h2><p class="guide">入口・動力・出口を一つの筐体に組み、自分の装置を作業台に置けます。</p><button id="openDesign">＋ 装置を設計する</button> <button id="commission">発明依頼に挑戦</button><div id="designShelf" aria-label="保存した設計図"></div><hr><h2>部品の引き出し</h2><p class="guide">部品を選んでマスに置きます。同じ部品をもう一度押すと、矢印が90度回ります。</p><div id="tools"></div><p id="detail"></p><button id="hint">設計ヒントを見る</button><p id="hintText" hidden></p></aside></div></main>
<dialog id="designer" aria-labelledby="designTitle"><form id="deviceForm"><header><h2 id="designTitle">オリジナル装置の設計</h2><button type="button" id="closeDesign" aria-label="閉じる">×</button></header>
<div class="designBody"><canvas id="blueprintView" width="180" height="112" aria-hidden="true"></canvas><p id="spec" aria-live="polite"></p>
<label>装置名<input id="deviceName" maxlength="32" placeholder="例：三連チャイム射出機"></label>
<label>入口<select id="intake"></select></label><label>玉の進路<select id="turn"><option value="1">進行方向から右折</option><option value="-1">進行方向から左折</option></select></label>
<label>内部の機構<select id="drive"></select></label><label>出口<select id="output"></select></label><label>ばねの射程<select id="range"><option value="1">1マス先</option><option value="2">2マス先</option><option value="3">3マス先</option></select></label>
<button id="trial" type="button">設計机で試運転</button><button class="makeDevice">設計図を保存して使う</button></div></form></dialog></body></html>
