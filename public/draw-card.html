<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>お絵描きカードバトル | ホームページの遊び場</title><link rel="stylesheet" href="/draw-card.css"><link rel="stylesheet" href="/playground-nav.css"><script defer src="/draw-card.js"></script><script defer src="/playground-nav.js"></script></head><body>
<header><a href="/">← 遊び場へ</a><b>INK CLUB <i>✦</i> CARD STUDIO</b></header><main>
<section class="intro"><small>PLAYGROUND 03　/　DRAW & DUEL</small><h1>お絵描き<span>カードバトル</span></h1><p>好きなものをひとつ描こう。どんな力が宿るかは、カードをめくるまでのお楽しみ。</p></section>
<div class="layout"><section class="desk"><small>01　/　SKETCHBOOK</small><h2>絵を描く</h2>
<div class="sheet"><canvas id="back" width="720" height="540" aria-hidden="true"></canvas><canvas id="ink" width="720" height="540" aria-label="マウス、指、ペンで描くキャンバス"></canvas></div>
<div class="tools"><label>ペン色 <input type="color" id="color" value="#282538"></label><label>太さ <input id="width" type="range" min="2" max="48" value="10"></label><button id="eraser" aria-pressed="false">消しゴム</button><button id="undo" disabled>ひとつ戻す</button></div>
<div class="background"><label><input type="checkbox" id="has-bg" checked> 背景を付ける</label><label>背景の種類 <select id="scene"></select></label></div>
<label class="name">カード名 <input id="name" maxlength="24" placeholder="空欄なら、おまかせ"></label><button id="make" class="primary">✦　この絵をカードにする</button><p id="notice" role="status"></p></section>
<section class="result"><small>02　/　YOUR CARD</small><h2>生まれたカード</h2><div id="placeholder"><span>✧</span><b>まだ見ぬ一枚</b><p>絵を描いてカードにすると、<br>ここに能力と効果が現れます。</p></div><div id="output" hidden><canvas width="720" height="980" id="card" role="img"></canvas><p id="description"></p><div class="actions"><button id="download">カード画像を保存 ↓</button><button id="duel">CPUと対戦する ⚡</button></div><div id="log" role="status"></div></div></section></div><footer>INK CLUB　/　同じ絵から何度でもカードを作れます。お気に入りはPNGで保存してください。</footer></main></body></html>
