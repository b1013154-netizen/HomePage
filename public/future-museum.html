<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203b35"><title>現代のものを未来で展示すると｜ホームページの遊び場</title><link rel="stylesheet" href="/playground-nav.css"><link rel="stylesheet" href="/future-museum.css"><script defer src="/playground-nav.js"></script><script defer src="/vendor/three/three.min.js"></script><script defer src="/museum-catalog.js"></script><script defer src="/museum-models.js"></script><script defer src="/museum-scene.js"></script><script defer src="/future-museum.js"></script></head><body>
<header><a href="/">✳ ホームページの遊び場</a><span>未来生活史博物館</span></header>
<main><section class="hero"><div><small>FUTURE MUSEUM OF EVERYDAY LIFE</small><h1>現代のものを<br>未来で展示すると</h1><p>今日のスプーンは、千年後の祭具かもしれない。</p></div></section>
<nav id="rooms" aria-label="博物館の操作"><button data-room="dig">埋設室</button><button data-room="exhibit">展示室</button><button data-room="rank">ランキング</button></nav>
<section id="dig"><div class="desk"><div><div class="section-head"><h2>埋めるものを選ぶ</h2><span>収蔵候補 100 種</span></div><div class="filters"><label>分類<select id="group"></select></label><label>品名を検索<input id="search" type="search" placeholder="例：スプーン"></label></div><div id="catalog"></div></div>
<aside><h2>埋設区画</h2><p>最大3品。区画を2か所押すと位置を入れ替えられます。</p><div id="plot"></div><div id="contents"></div><label>発掘する時代<select id="years"><option value="300">300年後</option><option value="1000" selected>1,000年後</option><option value="3000">3,000年後</option></select></label><label>会期<select id="period"><option value="7">7日間</option><option value="14">14日間</option><option value="30">30日間</option></select></label><button class="primary" id="bury">砂に埋める</button></aside></div></section>
<section id="exhibit" hidden><div id="empty"><h2>まだ展示品がありません</h2><button id="toDig">埋設室で品物を選ぶ</button></div><div id="excavation" hidden><small id="epoch"></small><h2>未来の発掘現場</h2><p>盛り上がった砂を押して、埋めた品を掘り出してください。</p><div id="mounds"></div><button id="openShow" class="primary">展示を開く</button></div><div id="openHall" hidden>
<div class="section-head"><h2 id="showTitle"></h2><span id="yearStamp"></span></div><div class="hall-layout"><div class="viewport"><canvas id="hall" aria-label="ドラッグで見回せる3D展示室"></canvas><div id="altHall" hidden></div><div id="cameraTools"><button id="overview">全景</button><button id="turn">回転</button><button id="near" aria-label="近づく">＋</button><button id="far" aria-label="離れる">−</button><button id="guests" aria-pressed="true">来館者</button></div></div><aside><div id="plates"></div><p id="quote"></p><div id="report"></div><button id="skip">閉幕まで進める</button><button id="again">次の埋設へ</button></aside></div></div></section>
<section id="rank" hidden><div class="section-head"><h2>歴代の展覧会</h2><span>このブラウザの記録</span></div><div id="sort"><button data-sort="visitors">総来客数順</button><button data-sort="rating">評判順</button></div><div id="chart"></div></section><p role="status" id="note"></p></main></body></html>
