<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#121e22"><title>一滴から育つ、小さな惑星｜ホームページの遊び場</title><link rel="stylesheet" href="/little-planet.css"><link rel="stylesheet" href="/playground-nav.css"><script defer src="/planet-surface.js"></script><script defer src="/little-planet.js"></script><script defer src="/playground-nav.js"></script></head><body>
<header class="mast"><a href="/">✳　ホームページの遊び場</a><a href="#journal">観測日誌 ↘</a></header>
<main><div class="heading"><h1>一滴から育つ、<br>小さな惑星<span>。</span></h1><p>まだ誰もいない星に、水をひとしずく。<br>どんな命が芽吹くかは、あなたが育てる環境次第。</p></div>
<div class="observatory"><section class="space" aria-label="惑星の観測窓"><div class="scopeTop"><span><i></i> 惑星観測窓</span><span id="epoch"></span></div><canvas id="globe" width="650" height="580" tabindex="0" aria-label="惑星。ドラッグまたは矢印キーで回転"></canvas><div class="scopeFoot"><div><small>現在の時代</small><h2 id="era"></h2></div><span>ドラッグで回転 ↔</span></div></section>
<section class="console"><p class="eyebrow">PLANET LAB</p><h2>環境を調整する</h2><div id="knobs"></div><p id="condition" role="status"></p><button id="step" class="primary">水を一滴落とす</button><button id="auto" aria-pressed="false">自動で時間を進める</button></section></div>
<section id="journal"><div class="journalHead"><div><p class="eyebrow">FIELD NOTES</p><h2>観測日誌</h2></div><p id="saved"></p></div><div class="notes"><div><h3>この星の歩み</h3><ol id="events"></ol></div><div><h3>見つかった生命と文明</h3><ul id="finds"></ul></div></div><details><summary>別の惑星を育てる</summary><p>現在の星と日誌を手放して、新しい地形の惑星で始めます。</p><button id="restart">新しい惑星をつくる</button></details></section></main></body></html>
