<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172c34"><title>縮尺が壊れた商店街｜ホームページの遊び場</title><link rel="stylesheet" href="/playground-nav.css"><link rel="stylesheet" href="/scale-town.css"><script defer src="/playground-nav.js"></script><script defer src="/scale-town-data.js"></script><script defer src="/scale-town-art.js"></script><script defer src="/scale-town-motion.js"></script><script defer src="/scale-town-trips.js"></script><script defer src="/scale-town-map.js"></script><script defer src="/scale-town.js"></script></head><body>
<header><a href="/">✳ 遊び場</a><i></i><span>街づくりスタジオ</span><button id="settings">街の設定</button></header>
<main><div class="mast"><div><small>SCALE DISTRICT</small><h1>縮尺が壊れた商店街<span>。</span></h1></div><div class="clock"><b id="day"></b><button id="speed" title="時間の速さ"></button><button id="pause" aria-label="時間を停止"></button></div></div>
<div class="metrics"><div><small>人口</small><strong id="pop"></strong></div><div><small>街の資金</small><strong id="cash"></strong></div><div><small>日次収支</small><strong id="income"></strong></div><div><small>住民満足度</small><strong id="happy"></strong></div></div>
<div class="council"><b id="popularity"></b><span id="landSize"></span><button id="expand"></button></div><div class="milestone"><span id="milestoneText"></span><progress id="milestoneProgress" aria-label="次の人口報酬まで"></progress><button id="rewardsOpen">人口報酬一覧</button></div><div class="workspace"><section class="map-wrap"><div class="maphead"><div><span class="lamp"></span><b id="cityName"></b></div><button id="statsOpen">街の統計 ↗</button></div><canvas id="map" aria-label="商店街の区画マップ"></canvas><div class="maptools"><button id="hand">✥ 移動</button><button id="streetView">通りを観察</button><button id="rotate" aria-label="視点を回転">↻</button><button id="plus" aria-label="拡大">＋</button><button id="minus" aria-label="縮小">−</button><button id="fit" aria-label="全景に戻す">全景</button><button id="night" aria-pressed="false">夜景</button></div><p id="message" role="status"></p></section>
<aside><h2>建設パレット</h2><div id="groups"></div><div id="palette"></div><div class="options"><strong id="selectedName"></strong><label>縮尺 <select id="scale"></select></label><label>正面 <select id="dir"><option>南</option><option>西</option><option>北</option><option>東</option></select></label><label>外観 <select id="style"><option>標準</option><option>木造回廊</option><option>モダンテラス</option></select></label><button id="remodel">既存の建物に向き・外観を適用</button><p id="spec"></p><div class="edit"><button id="inspect">区画を調べる</button><button id="resize">縮尺変更</button><button id="remove">撤去</button></div></div></aside></div>
</main><dialog id="setup"><form method="dialog"><div class="dialoghead"><h2>街の設定</h2><button aria-label="閉じる">×</button></div></form><label>街の名前 <input id="name" maxlength="24"></label><label>街の方針 <select id="theme"></select></label><p id="themeInfo"></p><label>住民税（1人・1日あたり G） <input id="tax" type="number" min="0" max="20" step="0.01" required></label><label><input id="free" type="checkbox"> 自由建築（建設費の支払いなし）</label><fieldset id="agreements"><legend>条約・条例</legend></fieldset><button id="apply">設定を保存</button><details class="new-town"><summary>新しい街を始める</summary><p>現在の街を置き換え、町外への入口と 3,500 G だけの更地から始めます。</p><button id="newTown">更地から始める</button></details></dialog>
<dialog id="rewards"><form method="dialog"><div class="dialoghead"><h2>人口の達成報酬</h2><button aria-label="閉じる">×</button></div></form><div id="rewardList"></div></dialog><dialog id="stats"><form method="dialog"><div class="dialoghead"><h2>街の統計</h2><button aria-label="閉じる">×</button></div></form><div id="details"></div><h3>最近の人口推移</h3><canvas id="trend" width="460" height="125"></canvas></dialog></body></html>
